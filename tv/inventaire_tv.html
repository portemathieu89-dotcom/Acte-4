<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventaires — The Last Heart</title><style>*{box-sizing:border-box}html,body{margin:0;background:#090706;color:#eee8dc;font-family:Georgia,serif}.wrap{min-height:100vh;padding:28px;background:radial-gradient(circle at top,#2c2118,#090706 70%)}h1{text-align:center;color:#d8b46a;margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;max-width:1500px;margin:auto}.card{background:linear-gradient(145deg,#2b2017,#130d09);border:2px solid #765534;border-radius:14px;padding:20px;min-height:250px;box-shadow:0 10px 30px #0008}.card h2{margin:0 0 12px;color:#d8b46a}.po{font-size:22px;margin-bottom:15px}.item{font-size:19px;padding:8px 0;border-bottom:1px solid #76553466}.empty{opacity:.55;font-style:italic}.updated{text-align:center;opacity:.45;margin-top:18px;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>🎒 Inventaires — The Last Heart</h1><div id="grid" class="grid"></div><div class="updated">Mise à jour automatique</div></main><script>const names=['Fïnn','Akio','Sylas','Syvens'];const key='theLastHeartPlayerInventories';function render(data){const d=Array.isArray(data)?data:[];document.getElementById('grid').innerHTML=names.map((n,i)=>{const p=d[i]||{name:n,po:0,items:[]};return '<article class="card"><h2>'+n+'</h2><div class="po">💰 '+Number(p.po||0).toLocaleString('fr-FR')+' PO</div>'+((p.items||[]).length?(p.items||[]).map(it=>'<div class="item">🎒 '+String(it.name||'')+' × '+Number(it.qty||0)+'</div>').join(''):'<div class="empty">Aucun objet.</div>')+'</article>'}).join('')}function load(){try{render(JSON.parse(localStorage.getItem(key)||'[]'))}catch(e){render([])}}window.addEventListener('message',e=>{if(e.data&&e.data.type==='theLastHeartInventories')render(e.data.data||[])});if('BroadcastChannel' in window){const ch=new BroadcastChannel('theLastHeartInventories');ch.onmessage=e=>{if(e.data)render(e.data.data||e.data)}}load();</script></body></html>
