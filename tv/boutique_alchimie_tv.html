<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>⚗️ Boutique d'alchimie — The Last Heart</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0806;color:#eee8dc;font-family:Georgia,serif}.wrap{min-height:100vh;padding:22px 28px;background:radial-gradient(circle at top,#302219 0,#120c08 55%,#080605 100%)}h1{text-align:center;color:#d8b46a;margin:0 0 4px}.sub{text-align:center;color:#b9a890;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;max-width:1800px;margin:auto}.card{background:linear-gradient(145deg,#2a1f17,#15100c);border:1px solid #765534;border-radius:10px;padding:14px;min-height:145px;box-shadow:0 7px 18px #0008}.name{font-size:18px;font-weight:bold;color:#e4c681}.price{font-size:19px;color:#f0d17d;font-weight:bold;margin-top:12px}.effect{font-size:13px;line-height:1.25;margin-top:8px}.foot{text-align:center;color:#8d806f;font-size:12px;margin-top:14px}@media(max-width:1200px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main class="wrap"><h1>⚗️ Boutique d'alchimie</h1><div class="sub">Potions et élixirs disponibles à la vente</div><section id="grid" class="grid"></section><div class="foot">The Last Heart — Affichage TV</div></main><script>const items=[["Potion de soins","50 PO","Rend 2d4 + 2 PV."],["Potion de soins supérieure","150 PO","Rend 4d4 + 4 PV."],["Potion de soins suprême","450 PO","Rend 8d4 + 8 PV."],["Potion de respiration aquatique","100 PO","Respiration sous l’eau pendant 1 heure."],["Potion d’escalade","75 PO","Escalade facilitée pendant 1 heure."],["Potion de croissance","150 PO","Effet d’Agrandissement pendant 1d4 heures."],["Potion de résistance","150 PO","Résistance à un type de dégâts pendant 1 heure."],["Potion d’amitié animale","150 PO","Effet d’Amitié avec les animaux pendant 1 heure."],["Potion de souffle de feu","150 PO","Permet de cracher du feu pendant 1 heure."],["Potion d’héroïsme","400 PO","10 PV temporaires + Bénédiction pendant 1 h."],["Potion de forme gazeuse","600 PO","Forme gazeuse pendant 1 heure."],["Potion de clairvoyance","600 PO","Effet de Clairvoyance."],["Potion de lecture des pensées","600 PO","Détection des pensées, DD 13."],["Potion d’invisibilité","1 000 PO","Invisible pendant 1 heure."],["Potion d’invulnérabilité","2 500 PO","Résistance à tous les dégâts pendant 1 minute."],["Potion de vitesse","1 500 PO","Effet de Hâte pendant 1 minute."],["Potion de vitalité","2 000 PO","Supprime l’épuisement et améliore la récupération."]];document.getElementById('grid').innerHTML=items.map(x=>'<article class="card"><div class="name">'+x[0]+'</div><div class="price">🪙 '+x[1]+'</div>'+(x[2]?'<div class="effect">'+x[2]+'</div>':'')+'</article>').join('');</script></body></html>
