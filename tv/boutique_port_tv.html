<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>⚓ Port — The Last Heart</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0806;color:#eee8dc;font-family:Georgia,serif}.wrap{min-height:100vh;padding:22px 28px;background:radial-gradient(circle at top,#302219 0,#120c08 55%,#080605 100%)}h1{text-align:center;color:#d8b46a;margin:0 0 4px}.sub{text-align:center;color:#b9a890;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;max-width:1800px;margin:auto}.card{background:linear-gradient(145deg,#2a1f17,#15100c);border:1px solid #765534;border-radius:10px;padding:14px;min-height:145px;box-shadow:0 7px 18px #0008}.name{font-size:18px;font-weight:bold;color:#e4c681}.price{font-size:19px;color:#f0d17d;font-weight:bold;margin-top:12px}.effect{font-size:13px;line-height:1.25;margin-top:8px}.foot{text-align:center;color:#8d806f;font-size:12px;margin-top:14px}@media(max-width:1200px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main class="wrap"><h1>⚓ Port</h1><div class="sub">Accostage, stationnement, réparations et services portuaires</div><section id="grid" class="grid"></section><div class="foot">The Last Heart — Affichage TV</div></main><script>const items=[["Accostage simple","1 po"],["Accostage + amarrage sécurisé","2 po"],["Accostage pour la nuit","2 po"],["Accostage + surveillance du navire","5 po / nuit"],["Stationnement du navire plusieurs jours","2 po / jour"],["Réparation légère du navire","10 po"],["Réparation moyenne","25 po"],["Réparation importante","50 po+"],["Chargement / déchargement de marchandises","1 po"],["Eau douce pour le navire","5 pa"]];document.getElementById('grid').innerHTML=items.map(x=>'<article class="card"><div class="name">'+x[0]+'</div><div class="price">🪙 '+x[1]+'</div>'+(x[2]?'<div class="effect">'+x[2]+'</div>':'')+'</article>').join('');</script></body></html>
