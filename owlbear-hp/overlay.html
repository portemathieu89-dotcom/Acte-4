<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Last Heart - PV Cast</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
#hpCast{position:fixed;top:18px;left:50%;transform:translateX(-50%);display:none;align-items:center;justify-content:center;gap:0;max-width:96vw;padding:9px 16px;border-radius:10px;background:rgba(12,9,7,.88);border:1px solid rgba(201,160,90,.75);box-shadow:0 4px 18px rgba(0,0,0,.45);color:#eadfc9;white-space:nowrap;pointer-events:none;box-sizing:border-box}
.player{font-size:20px;font-weight:700;padding:0 14px;text-shadow:0 1px 2px #000}.sep{font-size:18px;color:#8d7552}.temp{color:#d9c27a}
</style>
</head>
<body>
<div id="hpCast"></div>
<script>
(function(){
 const STORAGE_KEY="theLastHeartOwlbearHP",CHANNEL_NAME="theLastHeartOwlbearHP";
 let channel=null;
 try{if("BroadcastChannel" in window)channel=new BroadcastChannel(CHANNEL_NAME)}catch(e){}
 function escapeHTML(value){return String(value??"").replace(/[&<>"']/g,function(ch){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch])})}
 function render(players){
  const box=document.getElementById("hpCast");
  if(!Array.isArray(players)||!players.length){box.style.display="none";return}
  box.innerHTML=players.slice(0,4).map(function(p,i){
   const cur=p.current==null?"—":Math.max(0,Number(p.current)||0),max=p.max==null?"":"/"+Math.max(0,Number(p.max)||0),temp=Math.max(0,Number(p.temp)||0);
   return (i?"<span class=\"sep\">|</span>":"")+"<span class=\"player\">❤️ "+escapeHTML(p.name||"Joueur")+" "+cur+max+(temp?" <span class=\"temp\">🛡️"+temp+"</span>":"")+"</span>";
  }).join("");
  box.style.display="flex";
 }
 function accept(data){if(data&&Array.isArray(data.players))render(data.players)}
 try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");if(saved)accept(saved)}catch(e){}
 if(channel)channel.onmessage=function(event){accept(event.data)};
 window.addEventListener("storage",function(event){if(event.key===STORAGE_KEY&&event.newValue){try{accept(JSON.parse(event.newValue))}catch(e){}}});
})();
</script>
</body>
</html>
