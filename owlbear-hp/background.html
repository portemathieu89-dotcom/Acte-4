<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>The Last Heart - PV Cast</title></head>
<body>
<script type="module">
import OBR, { buildLabel } from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm";

const APP_CHANNEL="theLastHeartOwlbearHP";
const OBR_CHANNEL="the-last-heart/hp";
const STORAGE_KEY="theLastHeartOwlbearHP";
const LABEL_ID="the-last-heart/pv-cast-label";
let lastUpdatedAt=0;
let latestPlayers=null;
let isCastReceiver=false;
let labelExists=false;

function readPayload(){
  try{
    const payload=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
    return payload&&Array.isArray(payload.players)?payload:null;
  }catch(e){return null}
}

function labelText(players){
  return players.slice(0,5).map(function(p){
    const cur=p.current==null?"—":Math.max(0,Number(p.current)||0);
    const max=p.max==null?"":"/"+Math.max(0,Number(p.max)||0);
    const temp=Math.max(0,Number(p.temp)||0);
    return "❤️ "+String(p.name||"Joueur")+" "+cur+max+(temp?"  🛡️"+temp:"");
  }).join("   |   ");
}

async function getTopPosition(){
  const [position,scale,width,height]=await Promise.all([
    OBR.viewport.getPosition(),
    OBR.viewport.getScale(),
    OBR.viewport.getWidth(),
    OBR.viewport.getHeight()
  ]);
  const safeScale=Math.max(0.01,Number(scale)||1);
  return {
    x:Number(position.x)||0,
    y:(Number(position.y)||0)-Math.max(120,(Number(height)||720)*0.5/safeScale)+55/safeScale
  };
}

async function renderCastLabel(players){
  if(!isCastReceiver||!Array.isArray(players)||!players.length)return;
  latestPlayers=players;
  const position=await getTopPosition();
  const text=labelText(players);

  try{
    if(!labelExists){
      const label=buildLabel()
        .plainText(text)
        .fontFamily("Arial")
        .fontSize(24)
        .fontWeight(700)
        .padding(10)
        .backgroundColor("#0c0907")
        .backgroundOpacity(0.88)
        .cornerRadius(10)
        .disableHit(true)
        .locked(true)
        .position(position)
        .build();
      label.metadata["the-last-heart/pv-cast"]={type:"hp-label"};
      await OBR.scene.local.addItems([label]);
      labelExists=true;
    }else{
      await OBR.scene.local.updateItems(
        item=>item.metadata&&item.metadata["the-last-heart/pv-cast"]&&item.metadata["the-last-heart/pv-cast"].type==="hp-label",
        items=>{
          for(const item of items){
            item.text.plainText=text;
            item.position=position;
          }
        }
      );
    }
  }catch(e){
    console.error("The Last Heart PV Cast label:",e);
  }
}

async function forwardToRoom(payload){
  if(!payload||!Array.isArray(payload.players))return;
  const updatedAt=Number(payload.updatedAt)||0;
  if(updatedAt&&updatedAt<=lastUpdatedAt)return;
  if(updatedAt)lastUpdatedAt=updatedAt;
  latestPlayers=payload.players;
  try{
    await OBR.broadcast.sendMessage(OBR_CHANNEL,payload,{destination:"ALL"});
  }catch(e){
    console.error("The Last Heart PV Cast broadcast:",e);
  }
}

OBR.onReady(async()=>{
  try{
    const name=await OBR.player.getName();
    isCastReceiver=String(name||"").trim().toLowerCase()==="cast receiver";

    if("BroadcastChannel" in window){
      const channel=new BroadcastChannel(APP_CHANNEL);
      channel.onmessage=event=>{forwardToRoom(event.data)};
    }

    window.addEventListener("storage",event=>{
      if(event.key!==STORAGE_KEY||!event.newValue)return;
      try{forwardToRoom(JSON.parse(event.newValue))}catch(e){}
    });

    const initial=readPayload();
    if(initial)await forwardToRoom(initial);

    OBR.broadcast.onMessage(OBR_CHANNEL,event=>{
      const payload=event.data;
      if(payload&&Array.isArray(payload.players)){
        latestPlayers=payload.players;
        if(isCastReceiver)renderCastLabel(payload.players);
      }
    });

    if(isCastReceiver&&latestPlayers)await renderCastLabel(latestPlayers);

    if(isCastReceiver){
      setInterval(()=>{
        if(latestPlayers)renderCastLabel(latestPlayers);
      },1000);
    }
  }catch(e){
    console.error("The Last Heart PV Cast:",e);
  }
});
</script>
</body>
</html>
