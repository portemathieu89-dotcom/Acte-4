<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>The Last Heart - PV Cast</title></head>
<body>
<script type="module">
import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm";
const MODAL_ID="the-last-heart/pv-cast";
const OVERLAY_URL="/owlbear-hp/overlay.html";
OBR.onReady(async()=>{
  try{
    const name=await OBR.player.getName();
    if(String(name||"").toLowerCase().includes("cast receiver")){
      await OBR.modal.open({
        id:MODAL_ID,
        url:OVERLAY_URL,
        fullScreen:true,
        hideBackdrop:true,
        hidePaper:true,
        disablePointerEvents:true
      });
    }
  }catch(e){console.error("The Last Heart PV Cast:",e);}
});
</script>
</body>
</html>
