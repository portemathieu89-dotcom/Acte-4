<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>The Last Heart - PV Cast</title></head>
<body>
<script type="module">
import OBR, { buildLabel } from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm";

const LOCAL_API="http://127.0.0.1:5173/hp";
const OBR_CHANNEL="the-last-heart/hp";
const META_KEY="the-last-heart/pv-cast";
let lastUpdatedAt=0;
let latestPlayers=null;
let isCastReceiver=false;

function labelText(players){
  return players.slice(0,5).map(function(p){
    const cur=p.current==null?"—":Math.max(0,Number(p.current)||0);
    const max=p.max==null?"":"/"+Math.max(0,Number(p.max)||0);
    const temp=Math.max(0,Number(p.temp)||0);
    return "❤️ "+String(p.name||"Joueur")+" "+cur+max+(temp?"  🛡️"+temp:"");
  }).join("   |   ");
}

async function getTopPosition(){
  const [position,scale,height]=await Promise.all([
    OBR.viewport.getPosition(),
    OBR.viewport.getScale(),
    OBR.viewport.getHeight()
  ]);
  const safeScale=Math.max(0.01,Number(scale)||1);
  return {
    x:Number(position.x)||0,
    y:(Number(position.y)||0)-Math.max(120,(Number(height)||720)*0.5/safeScale)+55/safeScale
  };
}

async function renderCastLabel(players){
  if(!isCastReceiver||!Array.isArray(players)||!players.length)return;
  const text=labelText(players);
  const position=await getTopPosition();

  const items=await OBR.scene.local.getItems(function(item){
    return item.metadata&&item.metadata[META_KEY]&&item.metadata[META_KEY].type==="hp-label";
  });

  if(items.length){
    await OBR.scene.local.updateItems(items, function(current){
      for(const item of current){
        item.text.plainText=text;
        item.position=position;
      }
    }, true);
    return;
  }

  const label=buildLabel()
    .plainText(text)
    .fontFamily("Arial")
    .fontSize(24)
    .fontWeight(700)
    .padding(10)
    .backgroundColor("#0c0907")
    .backgroundOpacity(0.88)
    .cornerRadius(10)
    .disableHit(true)
    .locked(true)
    .position(position)
    .metadata({[META_KEY]:{type:"hp-label"}})
    .build();

  await OBR.scene.local.addItems([label]);
}

async function acceptPayload(payload){
  if(!payload||!Array.isArray(payload.players))return;
  const updatedAt=Number(payload.updatedAt)||0;
  if(updatedAt&&updatedAt<=lastUpdatedAt)return;
  if(updatedAt)lastUpdatedAt=updatedAt;
  latestPlayers=payload.players;

  if(isCastReceiver){
    try{await renderCastLabel(latestPlayers)}catch(e){
      console.error("The Last Heart PV Cast label:",e);
    }
  }

  try{
    await OBR.broadcast.sendMessage(OBR_CHANNEL,payload,{destination:"ALL"});
  }catch(e){}
}

async function pollLocalServer(){
  try{
    const response=await fetch(LOCAL_API,{cache:"no-store"});
    if(!response.ok)return;
    const payload=await response.json();
    await acceptPayload(payload);
  }catch(e){}
}

OBR.onReady(async()=>{
  try{
    const name=await OBR.player.getName();
    isCastReceiver=String(name||"").trim().toLowerCase()==="cast receiver";

    OBR.broadcast.onMessage(OBR_CHANNEL,event=>{
      if(event.data&&Array.isArray(event.data.players)){
        latestPlayers=event.data.players;
        if(isCastReceiver)renderCastLabel(latestPlayers).catch(()=>{});
      }
    });

    await pollLocalServer();
    setInterval(pollLocalServer,250);

    if(isCastReceiver){
      setInterval(()=>{
        if(latestPlayers)renderCastLabel(latestPlayers).catch(()=>{});
      },1000);
    }
  }catch(e){
    console.error("The Last Heart PV Cast:",e);
  }
});
</script>
</body>
</html>
